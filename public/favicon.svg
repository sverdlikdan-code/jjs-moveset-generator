<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0d0d1f"/>
  <rect width="64" height="64" rx="12" fill="url(#bg)" opacity="0.8"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2d1557"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Lightning bolt -->
  <polygon points="38,6 22,34 31,34 26,58 42,30 33,30" fill="#c084fc" filter="url(#glow)"/>
  <polygon points="38,6 22,34 31,34 26,58 42,30 33,30" fill="url(#bolt)"/>
  <defs>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
</svg>
